server:
  port: 8080
  error:
    include-message: never

spring:
  main:
    allow-bean-definition-overriding: true
  application:
    name: meeting-room-api

  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/RoomsMeeting
    username: postgres
    password: postgres

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          lob:
            non_contextual_creation: true

  flyway:
    enabled: true
    locations: classpath:db/migration





