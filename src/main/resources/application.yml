app:
  version: 1.0
  profiles:
    active: dev
  security:
    username: ${APP_AUTH_USER:admin}
    password: ${APP_AUTH_PASSWORD:admin123}
    jwt:
      secret: ${APP_JWT_SECRET:change-this-dev-jwt-secret-key-at-least-32-bytes}
      expiration-seconds: ${APP_JWT_EXPIRATION_SECONDS:3600}
  cors:
    allowed-origins: ${APP_CORS_ORIGINS:http://localhost:3000,http://localhost:5173}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
